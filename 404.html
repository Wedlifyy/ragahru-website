<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found — RagaHru</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#4A1520">
<!-- Served by the host for any address that does not exist, at whatever
     depth it was asked for - so every path here starts from the site root. -->
<link rel="icon" href="/assets/logo/favicon.png" type="image/png">
<link rel="preload" href="/assets/fonts/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/site.css">
<style>
  /* the same silk as the masthead, the whole screen tall, with its zari
     border along the foot */
  .lost {
    --focus: var(--zari);
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100svh;
    color: var(--on-silk);
    background:
      radial-gradient(80% 70% at 70% 25%, rgba(98, 32, 44, 0.8), rgba(98, 32, 44, 0) 70%),
      radial-gradient(70% 60% at 10% 95%, rgba(44, 11, 18, 0.85), rgba(44, 11, 18, 0) 70%),
      var(--silk);
  }
  .lost__body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-block: 64px;
  }
  .lost__mark { width: 72px; height: auto; margin-bottom: 28px; }
  .lost__title {
    max-width: 16ch;
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(2.6rem, 1.6rem + 4vw, 5rem);
    line-height: 1;
    letter-spacing: -0.025em;
  }
  .lost__text {
    margin-top: 22px;
    max-width: 40ch;
    font-size: var(--t-md);
    line-height: 1.6;
    color: var(--on-silk-2);
  }
  .lost__actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 34px; }
  .lost .signature { opacity: 1; transform: none; margin: 0 0 22px; width: 72px; }
</style>
</head>
<body>
<main class="lost">
  <div class="wrap lost__body">
    <img class="lost__mark" src="/assets/logo/ragahru-mark.webp" width="200" height="200" alt="RagaHru">
    <span class="signature" aria-hidden="true"></span>
    <h1 class="lost__title">This page isn&rsquo;t part of the invitation.</h1>
    <p class="lost__text">
      The link may be old, or mistyped. Every design is on the home page,
      and we&rsquo;re a message away on WhatsApp.
    </p>
    <div class="lost__actions">
      <a class="btn btn--zari" href="/#collections"><span>See the designs</span></a>
      <a class="btn btn--ghost" id="lost-wa" href="/" target="_blank" rel="noopener noreferrer">
        <svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.16-.17.2-.35.22-.64.08-.3-.15-1.26-.47-2.39-1.48-.88-.79-1.48-1.76-1.65-2.06-.18-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.91-2.2-.25-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.87 1.22 3.07c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.62.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.7.25-1.29.17-1.42-.07-.12-.27-.2-.57-.34M12.05 21.79h-.01c-1.77 0-3.5-.48-5.03-1.38l-.36-.22-3.74.99 1-3.65-.24-.38a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.89-9.88 2.64 0 5.12 1.03 6.99 2.9a9.83 9.83 0 0 1 2.89 6.99c0 5.45-4.43 9.89-9.88 9.89m8.41-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.15 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.69 1.45c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.17-3.48-8.42"/></svg>
        <span>Ask on WhatsApp</span>
      </a>
    </div>
  </div>
  <div class="zari" aria-hidden="true"><span class="zari__thread"><span class="zari__light"></span></span></div>
</main>

<!-- the WhatsApp link is built from the same number as the rest of the site -->
<script src="/config/site-config.js"></script>
<script>
  (function () {
    var link = document.getElementById('lost-wa');
    var cfg = (typeof SITE_CONFIG === 'object' && SITE_CONFIG) ? SITE_CONFIG : {};
    var digits = String(cfg.whatsappNumber || '').replace(/\D/g, '');
    if (!link || digits.length < 8) { return; }
    var text = cfg.generalMessage || 'Hello RagaHru, I would like to know more about your wedding websites.';
    link.href = 'https://wa.me/' + digits + '?text=' + encodeURIComponent(text);
  }());
</script>
</body>
</html>
